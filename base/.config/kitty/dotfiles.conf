# Personal kitty additions, pulled in by an `include` line at the end of
# ~/.config/kitty/kitty.conf (see install.sh).
#
# ADDITIVE ONLY: no colors, font, opacity, cursor or padding changes. Omarchy owns
# those (theme colors via `omarchy theme set`, font via `omarchy font set`).
# Cursor/padding tweaks live in overrides/.config/kitty/dotfiles-overrides.conf (opt-in).

# New window in the same working directory
map ctrl+alt+enter launch --cwd=current

# Opt-in overrides, only present after `./install.sh --with-overrides`
globinclude dotfiles-overrides.conf
