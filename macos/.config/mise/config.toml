[tools]
atuin = "latest" # synced shell history (Ctrl+R), server on rp5
bat = "latest"
delta = "latest" # git and lazygit diffs
difftastic = "latest" # syntax-aware diffs (lazygit `|` cycles to it)
docker-cli = "latest"
gh = "latest" # GitHub from the terminal: PRs, issues, Actions logs (gh auth login once)
jq = "latest" # JSON
yq = "latest" # YAML/TOML/XML, same syntax as jq (compose files, HA configs)
xh = "latest" # HTTP requests for APIs (httpie syntax, one binary)
lazydocker = "latest" # Docker TUI; remote too: DOCKER_HOST=ssh://rp5 lazydocker
dust = "latest" # what takes the disk space
watchexec = "latest" # re-run a command when files change (tests, builds, any language)
sd = "latest" # find & replace, simpler than sed
fd = "latest" # venv-selector.nvim searches for venvs with it
fzf = "latest"
jj = "latest" # Jujutsu: git-compatible VCS (trial); `jj git init --colocate` in a git repo
jjui = "latest" # TUI for jj, like lazygit for git
lazygit = "latest"
lsd = "latest"
lua = "latest"
neovim = "latest"
node = "latest"
python = "3.14"
"pipx:pre-commit" = "latest"
rclone = "latest"
ripgrep = "latest"
ruff = "latest"
starship = "latest"
tlrc = "latest"
tmux = "latest"
tree-sitter = "latest"
uv = "latest" # Python versions, venvs and packages; also the pipx: backend
yazi = "latest"
zoxide = "latest"
