#####################################################
# Set default terminal
#####################################################
# Programs inside tmux must see a tmux terminal, not kitty: with xterm-kitty they send
# kitty-only key codes that tmux does not pass through, and typing breaks.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys"
set -s extended-keys on
set -s escape-time 10      # quick Esc for zsh-vi-mode / nvim
set -g focus-events on
# kitty reads this title to send its macOS keys (cmd+t, cmd+d, cmd+1...) to tmux, see kitty.conf
set -g set-titles on
set -g set-titles-string "tmux #S:#W"

####################################################
# Set prefix
####################################################
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#####################################################
# Key bindings: the same as Omarchy's tmux.conf (Z13), so every machine uses one set.
# prefix + ? lists them on Omarchy; here: prefix + ? is tmux's own list.
#####################################################
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Panes
bind -n M-Enter split-window -v -c "#{pane_current_path}"     # Alt+Enter: split below
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"   # Alt+Shift+Enter: split right
bind -n M-Escape kill-pane
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Windows
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Sessions
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#####################################################
# set options
#####################################################
set -g mouse on
set -g default-shell /bin/zsh
set -g repeat-time 1000
set-option -g status-position top
set -g detach-on-destroy off   # closing the last window of a session switches to another session (as Omarchy)

#####################################################
# TokyoNight colors for Tmux
#####################################################
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_show_git 0


#####################################################
# List of plugins
#####################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other plugins:
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-yank'         

#####################################################
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#####################################################
if-shell 'test -x ~/.config/tmux/plugins/tpm/tpm' "run '~/.config/tmux/plugins/tpm/tpm'"

#####################################################
# Copy mode bindings for vi
#####################################################
# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#####################################################
# split pane bindings
#####################################################
# tmux's own split keys still work, opening in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
