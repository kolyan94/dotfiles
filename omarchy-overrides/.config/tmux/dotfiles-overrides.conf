# OPT-IN tmux overrides. Linked to ~/.config/tmux/dotfiles-overrides.conf by
# `./install.sh --with-overrides` and sourced from dotfiles.conf.
# Window/pane keys stay Omarchy's: the Macs use the same set (macos/.config/tmux/tmux.conf).

set -g repeat-time 1000

# tmux's default split keys open in the current directory, as on the Macs
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
