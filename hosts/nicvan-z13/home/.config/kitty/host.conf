# Z13 only: every kitty window starts in tmux, like on the Macs (session "main", extra windows get
# their own session that closes with the window). Without tmux it falls back to zsh.
shell /bin/sh -c 'exec "$HOME/.config/kitty/tmux-attach.sh"'

# Inside tmux (title "tmux <session>:<window>", set in ~/.config/tmux/host.conf) kitty's split/tab keys
# drive tmux instead. \x00 = Ctrl+Space, the tmux prefix. Outside tmux they keep kitty's meaning.
# Omarchy's tmux: v = split side by side, h = split below, Space = next layout.
map --when-focus-on title:^tmux kitty_mod+enter send_text all \x00v
map --when-focus-on title:^tmux ctrl+alt+enter send_text all \x00v
map --when-focus-on title:^tmux kitty_mod+t send_text all \x00c
map --when-focus-on title:^tmux kitty_mod+w send_text all \x00x
map --when-focus-on title:^tmux kitty_mod+q send_text all \x00&
map --when-focus-on title:^tmux kitty_mod+right send_text all \x00n
map --when-focus-on title:^tmux kitty_mod+left send_text all \x00p
map --when-focus-on title:^tmux kitty_mod+l send_text all \x00\x20
