# Radxa Zero 3 cyberdeck: Hyprland with Omarchy 4.5 keybindings (omacom/omarchy, MIT), keyboard only.
# Low heat: no blur, no shadows, no animations. Screen: 400x1280 panel rotated to 1280x400.
# Keys use `bindd` (with a description); "# @Section" lines group them in the SUPER+K list (deck-keys).
monitor = HDMI-A-1, preferred, auto, 1, transform, 1
monitor = , preferred, auto, 1

$terminal = kitty
$browser = chromium
$menu = fuzzel

exec-once = waybar
exec-once = mako
exec-once = swaybg -c '#1a1b26'
exec-once = wl-paste --watch cliphist store
exec-once = deck-follow
exec-once = localsend_app --hidden
exec-once = $terminal -e tmux new-session -A -s main

env = XCURSOR_SIZE,16
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

general {
    gaps_in = 2
    gaps_out = 3
    border_size = 2
    col.active_border = rgb(7aa2f7)
    col.inactive_border = rgb(292e42)
    layout = dwindle
    resize_on_border = false
}
decoration {
    rounding = 4
    blur:enabled = false
    shadow:enabled = false
}
animations { enabled = false }
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    disable_autoreload = true   # dotfiles sync replaces the file; reload via SUPER+Esc → reload, or hyprctl reload
    background_color = rgb(1a1b26)
}
cursor {
    inactive_timeout = 1
    hide_on_key_press = true
}
dwindle {
    preserve_split = true
}
input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
    repeat_rate = 40
    repeat_delay = 250
    follow_mouse = 0
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# @Apps
bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER ALT, RETURN, Terminal in tmux session main, exec, $terminal -e tmux new-session -A -s main
bindd = SUPER, SPACE, App launcher, exec, $menu
bindd = SUPER SHIFT, RETURN, Browser (Chromium), exec, $browser
bindd = SUPER SHIFT, B, Browser (Chromium), exec, $browser
bindd = SUPER SHIFT ALT, B, Browser private window, exec, $browser --incognito
bindd = SUPER SHIFT, SLASH, Passwords (Bitwarden), exec, bitwarden
bindd = SUPER SHIFT, L, LocalSend: send files and clipboard, exec, localsend_app
bindd = SUPER SHIFT, N, Editor (nvim), exec, $terminal -e nvim
bindd = SUPER SHIFT, F, Files (yazi), exec, $terminal -e yazi
bindd = SUPER SHIFT, W, Write: today's note in Obsidian Inbox, exec, $terminal -e write
bindd = SUPER SHIFT, T, Activity (btop), exec, $terminal -e btop
bindd = SUPER SHIFT, O, Obsidian vault in yazi, exec, $terminal -e yazi ~/Documents/Obsidian/Zettel

# @Windows
bindd = SUPER, W, Close window, killactive
bindd = SUPER, Q, Close window, killactive
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER ALT, F, Full width (keep bar), fullscreen, 1
bindd = SUPER, T, Toggle floating / tiling, togglefloating
bindd = SUPER, J, Toggle split direction, layoutmsg, togglesplit
bindd = SUPER, P, Pseudo tile, pseudo
bindd = SUPER, G, Toggle window group (tabs), togglegroup
bindd = SUPER ALT, TAB, Next window in group, changegroupactive, f
bindd = SUPER, LEFT, Focus left, movefocus, l
bindd = SUPER, RIGHT, Focus right, movefocus, r
bindd = SUPER, UP, Focus up, movefocus, u
bindd = SUPER, DOWN, Focus down, movefocus, d
bindd = SUPER SHIFT, LEFT, Swap window left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Swap window right, swapwindow, r
bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d
bindd = SUPER, minus, Narrower, resizeactive, -100 0
bindd = SUPER, equal, Wider, resizeactive, 100 0
bindd = SUPER SHIFT, minus, Shorter, resizeactive, 0 -60
bindd = SUPER SHIFT, equal, Taller, resizeactive, 0 60
bindd = ALT, TAB, Next window, cyclenext
bind = ALT, TAB, bringactivetotop

# @Workspaces
bindd = SUPER, 1, Workspace 1, workspace, 1
bindd = SUPER, 2, Workspace 2, workspace, 2
bindd = SUPER, 3, Workspace 3, workspace, 3
bindd = SUPER, 4, Workspace 4, workspace, 4
bindd = SUPER, 5, Workspace 5, workspace, 5
bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER, TAB, Next workspace, workspace, m+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, m-1
bindd = SUPER CTRL, TAB, Last used workspace, workspace, previous
bindd = SUPER, S, Scratchpad: show / hide, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# @Clipboard & capture
bindd = SUPER CTRL, V, Clipboard history, exec, cliphist list | fuzzel --dmenu --prompt "clip> " | cliphist decode | wl-copy
bindd = , Print, Screenshot of a region to clipboard, exec, grim -g "$(slurp)" - | wl-copy
bindd = SHIFT, Print, Screenshot of the screen to ~/Pictures, exec, mkdir -p ~/Pictures && grim ~/Pictures/screenshot-$(date +%F-%H%M%S).png && notify-send "Screenshot saved"
bindd = SUPER, Print, Color picker to clipboard, exec, hyprpicker -a

# @System
bindd = SUPER, K, This key list (Enter runs the action), exec, deck-keys
bindd = SUPER, ESCAPE, Deck menu (power · perf · wifi · lock), exec, deck-menu
bindd = SUPER CTRL, L, Lock screen, exec, hyprlock
bindd = SUPER CTRL, N, Night light on / off, exec, pkill hyprsunset || hyprsunset -t 4000
bindd = SUPER CTRL, P, Power mode cool / fast, exec, perf toggle
bindd = SUPER SHIFT, ESCAPE, Log out (restarts the session), exit
bindd = SUPER, I, Switch keyboard layout us ⇄ ua (also Alt+Shift), exec, hyprctl switchxkblayout all next
bindd = SUPER SHIFT, I, Switch keyboard layout back, exec, hyprctl switchxkblayout all prev

windowrule = float on, match:class ^(deck-float)$
# Bitwarden's login page does not scroll (fixed-height layout): give it the whole screen
windowrule = maximize on, match:class ^([Bb]itwarden)$
