# Radxa Zero 3 cyberdeck: Hyprland with Omarchy keybindings (omacom/omarchy, MIT), keyboard only.
# Low heat: no blur, no shadows, no animations. Screen: 400x1280 panel rotated to 1280x400.
monitor = HDMI-A-1, preferred, auto, 1, transform, 1
monitor = , preferred, auto, 1

$terminal = kitty
$menu = fuzzel

exec-once = waybar
exec-once = mako
exec-once = swaybg -c '#1a1b26'
exec-once = $terminal -e tmux new-session -A -s main

env = XCURSOR_SIZE,16

general {
    gaps_in = 2
    gaps_out = 3
    border_size = 2
    col.active_border = rgb(7aa2f7)
    col.inactive_border = rgb(292e42)
    layout = dwindle
    resize_on_border = false
}
decoration {
    rounding = 4
    blur:enabled = false
    shadow:enabled = false
}
animations { enabled = false }
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    background_color = rgb(1a1b26)
}
cursor {
    inactive_timeout = 1
    hide_on_key_press = true
}
dwindle {
    preserve_split = true
}
input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
    repeat_rate = 40
    repeat_delay = 250
    follow_mouse = 0
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ---- Omarchy keys (SUPER = the ⌘ key) ----
bind = SUPER, RETURN, exec, $terminal
bind = SUPER ALT, RETURN, exec, $terminal -e tmux new-session -A -s main
bind = SUPER, SPACE, exec, $menu
bind = SUPER, W, killactive
bind = SUPER, Q, killactive
bind = SUPER, J, layoutmsg, togglesplit
bind = SUPER, P, pseudo
bind = SUPER, T, togglefloating
bind = SUPER, F, fullscreen, 0
bind = SUPER ALT, F, fullscreen, 1
bind = SUPER SHIFT, N, exec, $terminal -e nvim
bind = SUPER SHIFT, F, exec, $terminal -e yazi
bind = SUPER SHIFT, W, exec, $terminal -e write      # writing mode
bind = SUPER, ESCAPE, exec, deck-menu                 # power / perf / wifi menu
bind = SUPER, K, exec, deck-keys                      # show these keys

bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = SUPER SHIFT, LEFT, swapwindow, l
bind = SUPER SHIFT, RIGHT, swapwindow, r
bind = SUPER SHIFT, UP, swapwindow, u
bind = SUPER SHIFT, DOWN, swapwindow, d
bind = SUPER, minus, resizeactive, -100 0
bind = SUPER, equal, resizeactive, 100 0
bind = SUPER SHIFT, minus, resizeactive, 0 -60
bind = SUPER SHIFT, equal, resizeactive, 0 60

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER, TAB, workspace, m+1
bind = SUPER SHIFT, TAB, workspace, m-1
bind = SUPER CTRL, TAB, workspace, previous
bind = ALT, TAB, cyclenext
bind = ALT, TAB, bringactivetotop
bind = SUPER, S, togglespecialworkspace, scratchpad
bind = SUPER ALT, S, movetoworkspacesilent, special:scratchpad
bind = SUPER, G, togglegroup
bind = SUPER ALT, TAB, changegroupactive, f

bind = SUPER CTRL, L, exec, hyprlock
bind = SUPER SHIFT, ESCAPE, exit
bind = , Print, exec, grim ~/screenshot-$(date +%F-%H%M%S).png

windowrule = float on, match:class ^(deck-float)$
