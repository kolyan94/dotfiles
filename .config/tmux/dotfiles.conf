# Personal tmux additions, sourced at the end of ~/.config/tmux/tmux.conf
# (see install.sh).
#
# ADDITIVE ONLY: plugins on keys Omarchy and tmux leave unbound. No existing
# binding or option is changed. Omarchy already provides the C-Space prefix, vi
# copy-mode, mouse, the theme-aware status line and the pane/window/session keys.
# Opt-in tweaks (S-Left/S-Right window keys, cwd-preserving splits) live in
# overrides/tmux.conf.

# Plugins (tpm is cloned by install.sh; prefix+I installs new ones)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'
# floax defaults to prefix+p, which would replace tmux's previous-window
set -g @floax-bind 'F'

# Opt-in overrides, only present after `./install.sh --with-overrides`
source-file -q ~/.config/tmux/dotfiles-overrides.conf

# Must stay last. Guarded so a missing tpm never errors at startup.
if-shell "test -x ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
