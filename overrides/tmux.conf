# OPT-IN tmux overrides. Linked to ~/.config/tmux/dotfiles-overrides.conf by
# `./install.sh --with-overrides` and sourced from dotfiles.conf.

set -g repeat-time 1000

# Shift-arrow / Alt-Shift-h/l switch windows (Shift-Left/Right stop reaching apps)
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Replace tmux's default split keys with cwd-preserving ones
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
