# OPT-IN kitty overrides: change Omarchy's default look. Linked to
# ~/.config/kitty/dotfiles-overrides.conf by `./install.sh --with-overrides`.
cursor_shape beam
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_trail 1
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2

window_padding_width 5 10
