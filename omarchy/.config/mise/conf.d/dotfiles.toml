# Layered on top of ~/.config/mise/config.toml (mise merges conf.d/*.toml).
#
# Only tools Omarchy does not already ship. Omarchy installs bat, fzf, lazygit,
# neovim, starship, tmux, zoxide, ripgrep, fd, eza, docker, tree-sitter and lua
# through pacman; installing them again here would shadow the pacman copies and
# drift from `omarchy update`. `node` is pinned in the main config, so it is not
# repeated. `lsd` is left out on purpose: Omarchy aliases ls to eza.
[tools]
rclone = "latest"
tlrc = "latest"
yazi = "latest"

# Embedded: Arduino CLI, and uv, which mise's pipx backend uses to install the
# Python tools below into isolated venvs (no system pip, no python-pipx).
arduino-cli = "latest"
uv = "latest"
"pipx:platformio" = "latest" # pio: ESP32 / Arduino / RP2040 builds, `pio device monitor`
"pipx:esptool" = "latest"    # flash / erase / read ESP chips directly

# Python (Omarchy's pacman python is the system interpreter; uv above installs other versions and
# makes project venvs, see mkvenv in common/.config/dotfiles/python.sh)
ruff = "latest"               # linter + formatter CLI (Neovim uses mason's copy)
"pipx:pre-commit" = "latest"  # git hooks most Python projects use
